id: disqualified-applicant-abroad
name: "Disqualified Applicant - No Residence in the Country (Hard Disqualifier)"
tenant: example_staffing
funnel_id: funnel_b_applicant
channel: whatsapp_text
mode: whatsapp_text

lead:
  name: "Jan Example"
  phone: "+15550100008"
  email: "test-abroad@example.com"

form_answers: {}

previous_context: null

messages:
  - text: "Hello"
    delay_seconds: 2
  - text: "My name is Jan Example and I'd like to work in your country."
    delay_seconds: 5
