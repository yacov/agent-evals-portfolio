channel: whatsapp_text
mode: whatsapp_text

lead:
  name: null
  phone: "+15550100013"
  email: "test-nosell@example.com"

form_answers: {}

previous_context: null

messages:
  - text: "Hello"
    delay_seconds: 2
  - text: "I'd just like to know what my flat is worth. I don't really want to sell."
