# Interested lead without time right now: PARTIAL with a callback request.
id: partial-callback
name: "Partial - Callback Requested (No Time Now)"
tenant: example_realty
funnel_id: real_estate_seller
channel: whatsapp_text
mode: whatsapp_text

lead:
  name: null
  phone: "+15550100015"
  email: "test-callback-realty@example.com"

form_answers: {}

previous_context: null

messages:
  - text: "Hello"
    delay_seconds: 2
  - text: "I have a flat in Central City, 1 Main Square."
    delay_seconds: 5
  - text: "I don't have time right now. Could you call me back tomorrow at 2 pm?"
    delay_seconds: 5
  - text: "Yes please, tomorrow at 2 pm. I have to go now."
    delay_seconds: 5

expected:
  disposition: PARTIAL
  tool_calls:
    - collect_slot
    - end_call
  intents:
    - SCHEDULE_CALLBACK
  forbidden_intents:
    - BOOK_APPOINTMENT
  slots:
    address_raw: "1 Main Square, Central City"
