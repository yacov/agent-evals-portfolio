channel: whatsapp_text
mode: whatsapp_text

lead:
  name: null
  phone: "+15550100026"
  email: "test-wa-ads@example.com"

form_answers:
  channel_choice: continue_whatsapp

previous_context: null

messages:
  - text: "Hello"
    delay_seconds: 2
