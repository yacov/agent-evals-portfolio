  tool_calls:
    - collect_slot
    - check_calendar
    - book_appointment
    - end_call
  intents:
    - CRM_UPDATE
  forbidden_intents:
    - BOOK_APPOINTMENT
  slots:
    company_name: "Sample Motors"
    region: "Central City"
    decision_maker: "managing director"
